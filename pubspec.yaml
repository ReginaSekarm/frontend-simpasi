name: simpasi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/start-face-forkspoon.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/start-face-forkspoon.png
  android_12:
    image: assets/images/start-face-forkspoon.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/start-face-forkspoon.png
    icon_background_color_dark: "#FFFFFF"
  android: true
  ios: true
  web: false
  fullscreen: true